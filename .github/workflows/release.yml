name: Verified signed release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: pwsh
env:
  PYTHONDONTWRITEBYTECODE: '1'
  AI_SETUP_CERT_SHA256: ${{ vars.SIGNER_CERTIFICATE_SHA256 }}
jobs:
  build:
    if: github.event_name == 'push' && github.ref_type == 'tag' && github.ref_protected && !github.event.repository.fork && github.repository == vars.RELEASE_REPOSITORY && vars.RELEASE_ENABLED == 'true'
    runs-on: windows-2025
    timeout-minutes: 60
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      version: ${{ steps.identity.outputs.version }}
      inner_id: ${{ steps.inner.outputs.artifact-id }}
      inner_digest: ${{ steps.inner.outputs.artifact-digest }}
      cohort_id: ${{ steps.cohort.outputs.artifact-id }}
      cohort_digest: ${{ steps.cohort.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.401'
          global-json-file: global.json
          architecture: x64
          cache: false
      - name: Freeze protected tag identity
        id: identity
        env:
          TAG: ${{ github.ref_name }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          if ($env:TAG -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Invalid version tag' }
          $commit=(git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $commit -cne $env:EXPECTED_COMMIT) { throw 'Source identity mismatch' }
          "commit=$commit" >> $env:GITHUB_OUTPUT
          "version=$($env:TAG.Substring(1))" >> $env:GITHUB_OUTPUT
      - name: Test and produce complete unsigned inner payloads
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          COMMIT: ${{ steps.identity.outputs.commit }}
        run: ./build/build.ps1 -Version $env:VERSION -SourceCommit $env:COMMIT -OutputDirectory C:/build/ai-desktop-setup/cohort/inner-unsigned
      - run: ./build/prepare-release.ps1
      - name: Run release policy tests (native candidate tests remain a separate gate)
        run: |
          Import-Module $env:AI_SETUP_PESTER
          Invoke-Pester build/VerifyRelease.Tests.ps1 -CI
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: inner
        with:
          name: inner-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: C:/build/ai-desktop-setup/cohort/inner-unsigned
          if-no-files-found: error
          overwrite: false
          retention-days: 40
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: cohort
        with:
          name: build-cohort-${{ github.run_id }}-${{ github.run_attempt }}
          path: C:/build/ai-desktop-setup/cohort
          include-hidden-files: true
          if-no-files-found: error
          overwrite: false
          retention-days: 40

  inner:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 240
    environment: signing-inner
    permissions:
      contents: read
      actions: read
    outputs:
      payload_id: ${{ steps.payload.outputs.artifact-id }}
      payload_digest: ${{ steps.payload.outputs.artifact-digest }}
      outer_id: ${{ steps.outer.outputs.artifact-id }}
      outer_digest: ${{ steps.outer.outputs.artifact-digest }}
      request_id: ${{ steps.sign.outputs.signing-request-id }}
      request_url: ${{ steps.sign.outputs.signing-request-web-url }}
      download_url: ${{ steps.sign.outputs.signed-artifact-download-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.build.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.build.outputs.inner_id }}
          path: unsigned-inner
          merge-multiple: true
          digest-mismatch: error
      - run: ./build/prepare-release.ps1
      - uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092
        id: sign
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: inner
          github-artifact-id: ${{ needs.build.outputs.inner_id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 10800
          output-artifact-directory: signed-inner
          parameters: |
            version: "${{ needs.build.outputs.version }}"
      - name: Retain returned signing request identity even on a later failure
        if: always() && steps.sign.outputs.signing-request-id != ''
        env:
          REQUEST_ID: ${{ steps.sign.outputs.signing-request-id }}
          REQUEST_URL: ${{ steps.sign.outputs.signing-request-web-url }}
          DOWNLOAD_URL: ${{ steps.sign.outputs.signed-artifact-download-url }}
        run: |
          @{request_id=$env:REQUEST_ID;request_url=$env:REQUEST_URL;download_url=$env:DOWNLOAD_URL;run_id=$env:GITHUB_RUN_ID;run_attempt=$env:GITHUB_RUN_ATTEMPT} | ConvertTo-Json | Set-Content signing-request.json -Encoding utf8NoBOM
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.sign.outputs.signing-request-id != ''
        with:
          name: inner-request-${{ github.run_id }}-${{ github.run_attempt }}
          path: signing-request.json
          if-no-files-found: error
          overwrite: false
          retention-days: 40
      - name: Verify signed inner bytes, then package without recompilation
        env:
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          ./build/verify-release.ps1 -Stage Inner -UnsignedPayloadDirectory unsigned-inner -PayloadDirectory signed-inner -SourceCommit $env:COMMIT -Version $env:VERSION -Output inner-verification.json
          foreach ($arch in @('x64','arm64')) {
            python build/package.py --payload "signed-inner/$arch" --architecture $arch --version $env:VERSION --output "unsigned-outer/AI-Desktop-Setup-$($env:VERSION)-$arch.exe" --inner-verification inner-verification.json
            if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: payload
        with:
          name: inner-signed-${{ github.run_id }}-${{ github.run_attempt }}
          path: signed-inner
          if-no-files-found: error
          overwrite: false
          retention-days: 40
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: outer
        with:
          name: outer-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: unsigned-outer
          if-no-files-found: error
          overwrite: false
          retention-days: 40

  candidate:
    needs: [build, inner]
    runs-on: windows-2025
    timeout-minutes: 240
    environment: signing-outer
    permissions:
      contents: read
      actions: read
    outputs:
      candidate_id: ${{ steps.candidate.outputs.artifact-id }}
      candidate_digest: ${{ steps.seal.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.build.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.inner.outputs.outer_id }}
          path: unsigned-outer
          merge-multiple: true
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.inner.outputs.payload_id }}
          path: signed-inner
          merge-multiple: true
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.build.outputs.cohort_id }}
          path: cohort
          merge-multiple: true
          digest-mismatch: error
      - run: ./build/prepare-release.ps1
      - uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092
        id: sign
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: outer
          github-artifact-id: ${{ needs.inner.outputs.outer_id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 10800
          output-artifact-directory: signed-outer
          parameters: |
            version: "${{ needs.build.outputs.version }}"
      - name: Retain returned signing request identity even on a later failure
        if: always() && steps.sign.outputs.signing-request-id != ''
        env:
          REQUEST_ID: ${{ steps.sign.outputs.signing-request-id }}
          REQUEST_URL: ${{ steps.sign.outputs.signing-request-web-url }}
          DOWNLOAD_URL: ${{ steps.sign.outputs.signed-artifact-download-url }}
        run: |
          @{request_id=$env:REQUEST_ID;request_url=$env:REQUEST_URL;download_url=$env:DOWNLOAD_URL;run_id=$env:GITHUB_RUN_ID;run_attempt=$env:GITHUB_RUN_ATTEMPT} | ConvertTo-Json | Set-Content signing-request.json -Encoding utf8NoBOM
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.sign.outputs.signing-request-id != ''
        with:
          name: outer-request-${{ github.run_id }}-${{ github.run_attempt }}
          path: signing-request.json
          if-no-files-found: error
          overwrite: false
          retention-days: 40
      - name: Native outer and extracted-inner verification, then final-byte hashes
        env:
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT: ${{ needs.build.outputs.commit }}
          TAG: ${{ github.ref_name }}
        run: |
          ./build/verify-release.ps1 -ReleaseDirectory signed-outer -UnsignedReleaseDirectory unsigned-outer -PayloadDirectory signed-inner -SourceCommit $env:COMMIT -Version $env:VERSION -Output signed-outer/verification.json
          python build/write-release-metadata.py --release-dir signed-outer --verification signed-outer/verification.json --version $env:VERSION --tag $env:TAG --commit $env:COMMIT --repository $env:GITHUB_REPOSITORY --run-id $env:GITHUB_RUN_ID
          if ($LASTEXITCODE -ne 0) { throw 'Metadata gate failed' }
          Copy-Item cohort/attachments/nsis-3.12-src.tar.bz2 signed-outer/
      - name: Record exact request and transport identities
        env:
          COMMIT: ${{ needs.build.outputs.commit }}
          COHORT_ID: ${{ needs.build.outputs.cohort_id }}
          COHORT_DIGEST: ${{ needs.build.outputs.cohort_digest }}
          PAYLOAD_ID: ${{ needs.inner.outputs.payload_id }}
          PAYLOAD_DIGEST: ${{ needs.inner.outputs.payload_digest }}
          INNER_REQUEST: ${{ needs.inner.outputs.request_id }}
          INNER_URL: ${{ needs.inner.outputs.request_url }}
          INNER_DOWNLOAD: ${{ needs.inner.outputs.download_url }}
          OUTER_REQUEST: ${{ steps.sign.outputs.signing-request-id }}
          OUTER_URL: ${{ steps.sign.outputs.signing-request-web-url }}
          OUTER_DOWNLOAD: ${{ steps.sign.outputs.signed-artifact-download-url }}
          INNER_ID: ${{ needs.build.outputs.inner_id }}
          INNER_DIGEST: ${{ needs.build.outputs.inner_digest }}
          OUTER_ID: ${{ needs.inner.outputs.outer_id }}
          OUTER_DIGEST: ${{ needs.inner.outputs.outer_digest }}
        run: |
          if (!$env:INNER_REQUEST -or !$env:OUTER_REQUEST) { throw 'Both signing request IDs required' }
          @{schema_version=1;source_commit=$env:COMMIT;cohort_id=$env:COHORT_ID;cohort_digest=$env:COHORT_DIGEST;signed_payload_id=$env:PAYLOAD_ID;signed_payload_digest=$env:PAYLOAD_DIGEST;repository=$env:GITHUB_REPOSITORY;run_id=$env:GITHUB_RUN_ID;run_attempt=$env:GITHUB_RUN_ATTEMPT;inner=@{request=$env:INNER_REQUEST;url=$env:INNER_URL;download=$env:INNER_DOWNLOAD;artifact_id=$env:INNER_ID;transport_sha256=$env:INNER_DIGEST};outer=@{request=$env:OUTER_REQUEST;url=$env:OUTER_URL;download=$env:OUTER_DOWNLOAD;artifact_id=$env:OUTER_ID;transport_sha256=$env:OUTER_DIGEST}} | ConvertTo-Json -Depth 6 | Set-Content signed-outer/signing-requests.json -Encoding utf8NoBOM
      - name: Seal exact candidate for independent acceptance
        id: seal
        env:
          COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          $digest=python build/release-candidate.py seal --root signed-outer --commit $env:COMMIT --run $env:GITHUB_RUN_ID --attempt $env:GITHUB_RUN_ATTEMPT
          if ($LASTEXITCODE -ne 0) { throw 'Candidate sealing failed' }
          "digest=$digest" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: candidate
        with:
          name: signed-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: signed-outer
          if-no-files-found: error
          overwrite: false
          retention-days: 40
      - name: Exact candidate approval instructions
        env:
          CANDIDATE_ID: ${{ steps.candidate.outputs.artifact-id }}
          INDEX_DIGEST: ${{ steps.seal.outputs.digest }}
          COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          "Candidate artifact ID: $env:CANDIDATE_ID; index SHA256: $env:INDEX_DIGEST; commit: $env:COMMIT; run: $env:GITHUB_RUN_ID/$env:GITHUB_RUN_ATTEMPT" >> $env:GITHUB_STEP_SUMMARY
          "Approve windows-acceptance only after real x64 and ARM64 installation evidence; approve private-audit only after the current exact signed cohort passes independent audit. Neither approval may reuse source-only or unsigned receipts." >> $env:GITHUB_STEP_SUMMARY
          Get-Content signed-outer/SHA256SUMS >> $env:GITHUB_STEP_SUMMARY

  windows_acceptance:
    needs: [build, candidate]
    runs-on: windows-2025
    environment:
      name: windows-acceptance
      url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    outputs:
      accepted_digest: ${{ steps.accept.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.build.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.candidate.outputs.candidate_id }}
          path: candidate
          merge-multiple: true
          digest-mismatch: error
      - name: Confirm approved bytes from the original run and attempt
        id: accept
        env:
          DIGEST: ${{ needs.candidate.outputs.candidate_digest }}
          COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          python build/release-candidate.py check --root candidate --digest $env:DIGEST --commit $env:COMMIT --run $env:GITHUB_RUN_ID --attempt $env:GITHUB_RUN_ATTEMPT
          if ($LASTEXITCODE -ne 0) { throw 'Accepted candidate changed' }
          "digest=$env:DIGEST" >> $env:GITHUB_OUTPUT

  private_audit:
    needs: [build, candidate]
    runs-on: windows-2025
    environment:
      name: private-audit
      url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    outputs:
      accepted_digest: ${{ steps.accept.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.build.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.candidate.outputs.candidate_id }}
          path: candidate
          merge-multiple: true
          digest-mismatch: error
      - name: Confirm approved bytes from the original run and attempt
        id: accept
        env:
          DIGEST: ${{ needs.candidate.outputs.candidate_digest }}
          COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          python build/release-candidate.py check --root candidate --digest $env:DIGEST --commit $env:COMMIT --run $env:GITHUB_RUN_ID --attempt $env:GITHUB_RUN_ATTEMPT
          if ($LASTEXITCODE -ne 0) { throw 'Accepted candidate changed' }
          "digest=$env:DIGEST" >> $env:GITHUB_OUTPUT

  attest:
    needs: [build, candidate, windows_acceptance, private_audit]
    runs-on: windows-2025
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      bundle_id: ${{ steps.bundle.outputs.artifact-id }}
      bundle_digest: ${{ steps.bundle_hash.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.build.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.candidate.outputs.candidate_id }}
          path: candidate
          merge-multiple: true
          digest-mismatch: error
      - name: Require both exact-candidate approvals
        env:
          DIGEST: ${{ needs.candidate.outputs.candidate_digest }}
          WINDOWS_DIGEST: ${{ needs.windows_acceptance.outputs.accepted_digest }}
          AUDIT_DIGEST: ${{ needs.private_audit.outputs.accepted_digest }}
          COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          if ($env:DIGEST -cne $env:WINDOWS_DIGEST -or $env:DIGEST -cne $env:AUDIT_DIGEST) { throw 'Candidate approvals differ' }
          python build/release-candidate.py check --root candidate --digest $env:DIGEST --commit $env:COMMIT --run $env:GITHUB_RUN_ID --attempt $env:GITHUB_RUN_ATTEMPT
          if ($LASTEXITCODE -ne 0) { throw 'Candidate changed before attestation' }
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        id: attest
        with:
          subject-path: |
            candidate/AI-Desktop-Setup-${{ needs.build.outputs.version }}-x64.exe
            candidate/AI-Desktop-Setup-${{ needs.build.outputs.version }}-arm64.exe
            candidate/release-manifest.json
            candidate/verification.json
            candidate/candidate-index.json
      - name: Retain provenance bundle separately from sealed candidate
        id: bundle_hash
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          New-Item -ItemType Directory provenance | Out-Null
          Copy-Item -LiteralPath $env:BUNDLE -Destination provenance/provenance.sigstore.json
          "digest=$((Get-FileHash provenance/provenance.sigstore.json -Algorithm SHA256).Hash.ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: bundle
        with:
          name: provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: provenance
          if-no-files-found: error
          overwrite: false
          retention-days: 40

  publish:
    needs: [build, candidate, attest]
    runs-on: windows-2025
    environment: release-publication
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.build.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.candidate.outputs.candidate_id }}
          path: candidate
          merge-multiple: true
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.attest.outputs.bundle_id }}
          path: provenance
          merge-multiple: true
          digest-mismatch: error
      - name: Publish complete draft only after exact-byte and immutable-policy checks
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SETTINGS_TOKEN: ${{ secrets.RELEASE_SETTINGS_TOKEN }}
          COMMIT: ${{ needs.build.outputs.commit }}
          DIGEST: ${{ needs.candidate.outputs.candidate_digest }}
          BUNDLE_DIGEST: ${{ needs.attest.outputs.bundle_digest }}
          TAG: ${{ github.ref_name }}
        run: |
          python build/release-candidate.py check --root candidate --digest $env:DIGEST --commit $env:COMMIT --run $env:GITHUB_RUN_ID --attempt $env:GITHUB_RUN_ATTEMPT
          if ($LASTEXITCODE -ne 0) { throw 'Candidate changed before publication' }
          python build/publish-release.py --candidate candidate --bundle provenance/provenance.sigstore.json --bundle-sha256 $env:BUNDLE_DIGEST --repository $env:GITHUB_REPOSITORY --tag $env:TAG --commit $env:COMMIT
          if ($LASTEXITCODE -ne 0) { throw 'Publication or immutability postcheck failed; inspect release state and never replace bytes' }
